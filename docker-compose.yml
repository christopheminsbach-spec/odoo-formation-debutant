services:

  db:
    image: postgres:16
    container_name: airproof-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always


  odoo:
    image: odoo:19
    container_name: airproof-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"

    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo

    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - odoo_data:/var/lib/odoo

    restart: always


volumes:

  postgres_data:

  odoo_data:
